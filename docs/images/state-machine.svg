<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="980" viewBox="0 0 1600 980" role="img" aria-labelledby="title desc">
  <title id="title">Freelance Escrow State Machine</title>
  <desc id="desc">Flowchart of escrow and milestone state transitions, including approval, dispute resolution, and timeout refund paths.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.10"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" fill="#64748b"/>
    </marker>
    <style>
      .font { font-family: Inter, "Microsoft YaHei", "PingFang SC", Arial, sans-serif; }
      .title { font-size: 38px; font-weight: 700; fill: #0f172a; }
      .layer { font-size: 28px; font-weight: 700; fill: #1e293b; }
      .state { font-size: 26px; font-weight: 700; fill: #0f172a; }
      .stateText { font-size: 19px; fill: #475569; }
      .label { font-size: 24px; font-weight: 700; fill: #334155; }
      .arrow { fill: none; stroke: #64748b; stroke-width: 3; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect width="1600" height="980" fill="#ffffff"/>
  <text class="font title" x="800" y="48" text-anchor="middle">Freelance Escrow State Machine</text>

  <!-- Escrow lifecycle -->
  <rect x="30" y="75" width="1540" height="250" rx="8" fill="#fff8df"/>
  <text class="font layer" x="145" y="177" text-anchor="middle">Escrow</text>
  <text class="font layer" x="145" y="210" text-anchor="middle">Lifecycle</text>

  <g filter="url(#shadow)">
    <rect x="300" y="155" width="260" height="88" rx="14" fill="#ffffff" stroke="#d6a52f" stroke-width="2"/>
    <rect x="670" y="155" width="260" height="88" rx="14" fill="#a9d6f5" stroke="#315f7d" stroke-width="2"/>
    <rect x="1090" y="95" width="330" height="88" rx="14" fill="#b7efc5" stroke="#3f6f4c" stroke-width="2"/>
    <rect x="1090" y="217" width="330" height="88" rx="14" fill="#f3d1d1" stroke="#9f4f4f" stroke-width="2"/>
  </g>
  <text class="font state" x="430" y="191" text-anchor="middle">CREATED</text>
  <text class="font stateText" x="430" y="220" text-anchor="middle">Not funded</text>
  <text class="font state" x="800" y="191" text-anchor="middle">FUNDED</text>
  <text class="font stateText" x="800" y="220" text-anchor="middle">Project ETH locked</text>
  <text class="font state" x="1255" y="131" text-anchor="middle">COMPLETED</text>
  <text class="font stateText" x="1255" y="160" text-anchor="middle">Terminal settlement by release</text>
  <text class="font state" x="1255" y="253" text-anchor="middle">CANCELLED</text>
  <text class="font stateText" x="1255" y="282" text-anchor="middle">Terminal settlement by refund</text>

  <path class="arrow" d="M560 199 H670"/>
  <text class="font label" x="615" y="132" text-anchor="middle">Client funds total</text>
  <path class="arrow" d="M930 199 H1010 V139 H1090"/>
  <path class="arrow" d="M930 199 H1010 V261 H1090"/>
  <text class="font label" x="800" y="281" text-anchor="middle">All milestones reach terminal states</text>

  <!-- Milestone lifecycle -->
  <rect x="30" y="340" width="1540" height="610" rx="8" fill="#eaf4ff"/>
  <text class="font layer" x="145" y="623" text-anchor="middle">Milestone</text>
  <text class="font layer" x="145" y="656" text-anchor="middle">Lifecycle</text>

  <g filter="url(#shadow)">
    <rect x="285" y="450" width="240" height="90" rx="14" fill="#f5f0ff" stroke="#65549b" stroke-width="2"/>
    <rect x="650" y="450" width="260" height="90" rx="14" fill="#a9d6f5" stroke="#315f7d" stroke-width="2"/>
    <rect x="900" y="650" width="260" height="90" rx="14" fill="#f3d1d1" stroke="#9f4f4f" stroke-width="2"/>
    <rect x="1260" y="450" width="250" height="90" rx="14" fill="#b7efc5" stroke="#3f6f4c" stroke-width="2"/>
    <rect x="1260" y="650" width="250" height="90" rx="14" fill="#cfc1f5" stroke="#65549b" stroke-width="2"/>
  </g>
  <text class="font state" x="405" y="487" text-anchor="middle">PENDING</text>
  <text class="font stateText" x="405" y="517" text-anchor="middle">Awaiting delivery</text>
  <text class="font state" x="780" y="487" text-anchor="middle">SUBMITTED</text>
  <text class="font stateText" x="780" y="517" text-anchor="middle">Awaiting client review</text>
  <text class="font state" x="1030" y="687" text-anchor="middle">DISPUTED</text>
  <text class="font stateText" x="1030" y="717" text-anchor="middle">Awaiting arbitrator</text>
  <text class="font state" x="1385" y="487" text-anchor="middle">RELEASED</text>
  <text class="font stateText" x="1385" y="517" text-anchor="middle">Paid to Freelancer · Final</text>
  <text class="font state" x="1385" y="687" text-anchor="middle">REFUNDED</text>
  <text class="font stateText" x="1385" y="717" text-anchor="middle">Returned to Client · Final</text>

  <path class="arrow" d="M525 495 H650"/>
  <text class="font label" x="588" y="420" text-anchor="middle">Freelancer submits</text>

  <path class="arrow" d="M910 495 H1260"/>
  <text class="font label" x="1085" y="420" text-anchor="middle">Client approves</text>

  <path class="arrow" d="M780 540 L1010 650"/>
  <rect x="685" y="561" width="260" height="62" rx="8" fill="#eaf4ff"/>
  <text class="font label" x="815" y="588" text-anchor="middle">Client or Freelancer</text>
  <text class="font label" x="815" y="611" text-anchor="middle">raises dispute</text>

  <path class="arrow" d="M1160 650 L1260 540"/>
  <rect x="1135" y="558" width="140" height="70" rx="8" fill="#eaf4ff"/>
  <text class="font label" x="1205" y="585" text-anchor="middle">Arbitrator</text>
  <text class="font label" x="1205" y="612" text-anchor="middle">releases</text>

  <path class="arrow" d="M1160 695 H1260"/>
  <text class="font label" x="1210" y="780" text-anchor="middle">Arbitrator refunds</text>

  <path class="arrow" d="M405 540 V830 H1385 V740"/>
  <text class="font label" x="895" y="863" text-anchor="middle">Deadline passed · Client refunds a PENDING milestone</text>
</svg>
