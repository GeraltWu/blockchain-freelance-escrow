<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1080" viewBox="0 0 1600 1080" role="img" aria-labelledby="title desc">
  <title id="title">Freelance Escrow DApp Technical Architecture</title>
  <desc id="desc">The DApp uses separate on-chain and off-chain paths from the frontend to the smart contract and backend service.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.10"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
    <style>
      .font { font-family: Inter, "Microsoft YaHei", "PingFang SC", Arial, sans-serif; }
      .title { font-size: 38px; font-weight: 700; fill: #0f172a; }
      .layer { font-size: 28px; font-weight: 700; fill: #1e293b; }
      .section { font-size: 26px; font-weight: 700; fill: #1e293b; }
      .boxTitle { font-size: 26px; font-weight: 700; fill: #0f172a; }
      .boxText { font-size: 20px; fill: #475569; }
      .small { font-size: 18px; fill: #475569; }
      .role { font-size: 25px; font-weight: 700; fill: #0f172a; }
      .roleText { font-size: 18px; fill: #475569; }
      .arrow { fill: none; stroke: #64748b; stroke-width: 3; marker-end: url(#arrow); }
      .divider { stroke: #cbd5e1; stroke-width: 1.5; }
    </style>
  </defs>

  <rect width="1600" height="1080" fill="#ffffff"/>
  <text class="font title" x="800" y="48" text-anchor="middle">Freelance Escrow DApp Technical Architecture</text>

  <!-- Layer backgrounds -->
  <rect x="30" y="75" width="1540" height="125" rx="8" fill="#fff8df"/>
  <rect x="30" y="215" width="1540" height="140" rx="8" fill="#eaf8ef"/>
  <rect x="30" y="370" width="1540" height="170" rx="8" fill="#eaf4ff"/>
  <rect x="30" y="555" width="1540" height="300" rx="8" fill="#fff5f5"/>
  <rect x="30" y="870" width="1540" height="180" rx="8" fill="#f5f0ff"/>

  <!-- Layer labels -->
  <g class="font layer" text-anchor="middle">
    <text x="130" y="146">User Layer</text>
    <text x="130" y="279">Frontend</text>
    <text x="130" y="310">Layer</text>
    <text x="130" y="463">Integration</text>
    <text x="130" y="494">Layer</text>
    <text x="130" y="714">Core Services</text>
    <text x="145" y="954">Blockchain and</text>
    <text x="145" y="985">Data Layer</text>
  </g>

  <!-- User layer -->
  <g filter="url(#shadow)">
    <rect x="290" y="98" width="380" height="78" rx="14" fill="#ffffff" stroke="#60a5fa" stroke-width="2"/>
    <rect x="710" y="98" width="380" height="78" rx="14" fill="#ffffff" stroke="#2dd4bf" stroke-width="2"/>
    <rect x="1130" y="98" width="380" height="78" rx="14" fill="#ffffff" stroke="#a78bfa" stroke-width="2"/>
  </g>
  <circle cx="340" cy="126" r="13" fill="#60a5fa"/>
  <path d="M318 164 Q340 139 362 164 Z" fill="#93c5fd"/>
  <circle cx="760" cy="126" r="13" fill="#14b8a6"/>
  <path d="M738 164 Q760 139 782 164 Z" fill="#5eead4"/>
  <circle cx="1180" cy="126" r="13" fill="#8b5cf6"/>
  <path d="M1158 164 Q1180 139 1202 164 Z" fill="#c4b5fd"/>
  <text class="font role" x="400" y="136">Client</text>
  <text class="font roleText" x="400" y="163">Create, fund, approve</text>
  <text class="font role" x="820" y="136">Freelancer</text>
  <text class="font roleText" x="820" y="163">Submit work and dispute</text>
  <text class="font role" x="1240" y="136">Arbitrator</text>
  <text class="font roleText" x="1240" y="163">Resolve disputes</text>

  <!-- Presentation layer -->
  <g filter="url(#shadow)">
    <rect x="330" y="243" width="460" height="86" rx="14" fill="#b7efc5" stroke="#3f6f4c" stroke-width="2"/>
    <rect x="1010" y="243" width="460" height="86" rx="14" fill="#b7efc5" stroke="#3f6f4c" stroke-width="2"/>
  </g>
  <text class="font boxTitle" x="560" y="279" text-anchor="middle">React 19</text>
  <text class="font boxText" x="560" y="307" text-anchor="middle">DApp pages and interaction logic</text>
  <text class="font boxTitle" x="1240" y="279" text-anchor="middle">Mantine UI</text>
  <text class="font boxText" x="1240" y="307" text-anchor="middle">Interface components and forms</text>

  <!-- Communication layer: two explicit channels -->
  <path d="M560 329 L560 344 L1240 344 L1240 329" fill="none" stroke="#64748b" stroke-width="3"/>
  <path class="arrow" d="M900 344 L900 388 L560 388 L560 407"/>
  <path class="arrow" d="M900 344 L900 388 L1240 388 L1240 407"/>
  <g filter="url(#shadow)">
    <rect x="330" y="407" width="460" height="96" rx="13" fill="#a9d6f5" stroke="#315f7d" stroke-width="2"/>
    <rect x="1010" y="407" width="460" height="96" rx="13" fill="#a9d6f5" stroke="#315f7d" stroke-width="2"/>
  </g>
  <text class="font boxTitle" x="560" y="447" text-anchor="middle">MetaMask + Ethers.js</text>
  <text class="font boxText" x="560" y="478" text-anchor="middle">Wallet connection · Signing · Contract calls</text>
  <text class="font boxTitle" x="1240" y="447" text-anchor="middle">Axios + REST API</text>
  <text class="font boxText" x="1240" y="478" text-anchor="middle">HTTPS requests · Nginx reverse proxy</text>

  <!-- Core services: on-chain and off-chain branches -->
  <path class="arrow" d="M560 503 L560 592"/>
  <path class="arrow" d="M1240 503 L1240 592"/>
  <rect x="270" y="592" width="580" height="228" rx="14" fill="#fffafa" stroke="#9f4f4f" stroke-width="2"/>
  <rect x="950" y="592" width="580" height="228" rx="14" fill="#fffafa" stroke="#9f4f4f" stroke-width="2"/>
  <text class="font section" x="560" y="630" text-anchor="middle">On-chain Smart Contract</text>
  <text class="font section" x="1240" y="630" text-anchor="middle">Off-chain Backend Service</text>

  <g filter="url(#shadow)">
    <rect x="315" y="650" width="490" height="66" rx="10" fill="#f3d1d1" stroke="#9f4f4f"/>
    <rect x="995" y="650" width="490" height="66" rx="10" fill="#f3d1d1" stroke="#9f4f4f"/>
  </g>
  <text class="font boxTitle" x="560" y="691" text-anchor="middle">FreelanceEscrow.sol</text>
  <text class="font boxTitle" x="1240" y="691" text-anchor="middle">Flask Backend Service</text>

  <line class="divider" x1="310" y1="738" x2="810" y2="738"/>
  <line class="divider" x1="990" y1="738" x2="1490" y2="738"/>
  <text class="font boxText" x="365" y="771">• ETH custody</text>
  <text class="font boxText" x="590" y="771">• Milestone workflow</text>
  <text class="font boxText" x="365" y="802">• Role permissions</text>
  <text class="font boxText" x="590" y="802">• Disputes and refunds</text>
  <text class="font boxText" x="1045" y="771">• Project metadata</text>
  <text class="font boxText" x="1285" y="771">• Transaction history</text>
  <text class="font boxText" x="1045" y="802">• Request validation</text>
  <text class="font boxText" x="1285" y="802">• On-chain state mirror</text>

  <!-- Blockchain and data layer -->
  <path class="arrow" d="M560 820 L560 912"/>
  <path class="arrow" d="M1240 820 L1240 912"/>
  <g filter="url(#shadow)">
    <rect x="315" y="912" width="490" height="100" rx="13" fill="#cfc1f5" stroke="#65549b" stroke-width="2"/>
    <rect x="995" y="912" width="490" height="100" rx="13" fill="#cfc1f5" stroke="#65549b" stroke-width="2"/>
  </g>
  <text class="font boxTitle" x="560" y="951" text-anchor="middle">Ethereum Sepolia</text>
  <text class="font boxText" x="560" y="980" text-anchor="middle">Contract state · Escrowed ETH · Events</text>
  <text class="font boxTitle" x="1240" y="951" text-anchor="middle">SQLite Database</text>
  <text class="font boxText" x="1240" y="980" text-anchor="middle">Metadata · State mirror · Transactions</text>
</svg>
